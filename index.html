<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassPulse — Real-Time Teacher Attendance & Schedule</title>
    <meta name="description" content="Check live teacher attendance, daily class schedules, and real-time updates for classes. Designed for students and class representatives." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="ClassPulse — Real-Time Teacher Attendance Dashboard" />
    <meta property="og:description" content="Check live teacher attendance, daily class schedules, and real-time updates instantly." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://classpulse.app" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassPulse — Real-Time Teacher Attendance" />
    <meta name="twitter:description" content="Live teacher attendance and class schedules." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-subtle { animation: pulse-subtle 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-full flex flex-col selection:bg-sky-500 selection:text-white">

    <div id="app" class="min-h-full flex flex-col flex-grow">
        
        <!-- Header / Navigation -->
        <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="appState.currentView = 'dashboard'; renderApp();">
                    <div class="w-10 h-10 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 flex items-center justify-center font-bold text-lg shadow-sm">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-lg tracking-tight">ClassPulse</span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300">Live</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Real-Time Teacher Attendance</p>
                    </div>
                </div>

                <!-- Center: Connection status & date -->
                <div class="hidden md:flex items-center space-x-4 text-sm text-slate-600 dark:text-slate-300">
                    <div class="flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-800/60 px-3 py-1 rounded-full">
                        <span id="connection-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="connection-text" class="text-xs font-medium">Live Synced</span>
                    </div>
                    <span class="text-slate-300 dark:text-slate-700">|</span>
                    <div id="header-date" class="text-xs font-medium text-slate-500 dark:text-slate-400">
                        <!-- Date injected via JS -->
                    </div>
                </div>

                <!-- Right: Actions (Theme Toggle, Install PWA, Admin Portal) -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- Install PWA Button (Hidden by default until prompt) -->
                    <button id="install-btn" onclick="installPWA()" title="Install App" class="hidden items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 hover:bg-emerald-100 dark:bg-emerald-950/50 dark:text-emerald-300 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800 transition">
                        <i class="fa-solid fa-download"></i>
                        <span class="hidden sm:inline">Install App</span>
                    </button>

                    <!-- Theme Toggle -->
                    <button onclick="toggleTheme()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Theme">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>

                    <!-- Portal switch -->
                    <div id="auth-nav-container">
                        <!-- Injected dynamically based on auth state -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow flex flex-col">
            <div id="view-container" class="flex-grow flex flex-col">
                <!-- Views get rendered here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-xs text-slate-500 dark:text-slate-400">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-2">
                    <span class="font-semibold text-slate-700 dark:text-slate-300">ClassPulse v2.5</span>
                    <span>&bull;</span>
                    <span>Made by <a href="https://naod-araya.vercel.app/?v=11" target="_blank" class="text-sky-600 dark:text-sky-400 font-medium hover:underline">Naod Araya</a></span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="footer-sync-time">Last synced: Just now</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modals & Notifications Container -->
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // Global Application State
        const appState = {
            currentView: 'dashboard', // 'dashboard', 'login', 'admin', 'history', 'setup-guide'
            user: null, // Supabase user if logged in as rep
            userRole: 'student', // 'student' or 'representative'
            classes: [],
            teachers: [],
            subjects: [],
            sessions: [], // Daily sessions with status
            auditLogs: [],
            loading: true,
            error: null,
            filters: {
                status: 'all',
                search: '',
                teacher: 'all',
                subject: 'all',
                date: new Date().toISOString().split('T')[0]
            },
            connectionStatus: 'connecting', // 'connected', 'disconnected', 'connecting'
            installPromptEvent: null,
            isOnline: navigator.onLine
        };

        // Supabase Client Initialization
        const defaultSupabaseUrl = 'https://placeholder.supabase.co';
        const defaultSupabaseKey = 'placeholder-key';
        
        let supabaseUrl = localStorage.getItem('cp_supabase_url') || defaultSupabaseUrl;
        let supabaseKey = localStorage.getItem('cp_supabase_key') || defaultSupabaseKey;
        
        let supabaseClient = null;

        function initSupabase() {
            try {
                if (window.supabase && supabaseUrl !== defaultSupabaseUrl && supabaseKey !== defaultSupabaseKey) {
                    supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
                    checkConnection();
                } else {
                    supabaseClient = createMockSupabaseClient();
                    appState.connectionStatus = 'connected';
                }
            } catch (err) {
                console.error("Supabase init error:", err);
                supabaseClient = createMockSupabaseClient();
                appState.connectionStatus = 'connected';
            }
        }

        // Mock Supabase Client for out-of-the-box zero-config demonstration & offline robustness
        function createMockSupabaseClient() {
            console.info("ClassPulse: Initializing robust Local/Session Mock Database backend.");
            
            if (!localStorage.getItem('cp_mock_teachers')) {
                localStorage.setItem('cp_mock_teachers', JSON.stringify([
                    { id: 't1', name: 'Dr. Eleanor Vance', department: 'Computer Science', email: 'vance@university.edu' },
                    { id: 't2', name: 'Prof. Marcus Brody', department: 'Mathematics', email: 'brody@university.edu' },
                    { id: 't3', name: 'Dr. Sarah Al-Fassi', department: 'Physics', email: 'alfassi@university.edu' },
                    { id: 't4', name: 'Prof. James Wilson', department: 'English Literature', email: 'wilson@university.edu' },
                    { id: 't5', name: 'Dr. Robert Chen', department: 'Data Structures', email: 'chen@university.edu' }
                ]));
            }

            if (!localStorage.getItem('cp_mock_subjects')) {
                localStorage.setItem('cp_mock_subjects', JSON.stringify([
                    { id: 's1', name: 'Advanced Algorithms', code: 'CS-401' },
                    { id: 's2', name: 'Linear Algebra & Calculus', code: 'MATH-302' },
                    { id: 's3', name: 'Quantum Mechanics II', code: 'PHYS-410' },
                    { id: 's4', name: 'Modern World Literature', code: 'ENG-205' },
                    { id: 's5', name: 'Database Systems', code: 'CS-350' }
                ]));
            }

            if (!localStorage.getItem('cp_mock_classes')) {
                localStorage.setItem('cp_mock_classes', JSON.stringify([
                    { id: 'c1', subject_id: 's1', teacher_id: 't1', room: 'Hall A1', start_time: '08:30', end_time: '10:00', day_of_week: 'Monday' },
                    { id: 'c2', subject_id: 's2', teacher_id: 't2', room: 'Room 204', start_time: '10:15', end_time: '11:45', day_of_week: 'Monday' },
                    { id: 'c3', subject_id: 's3', teacher_id: 't3', room: 'Lab 3B', start_time: '13:00', end_time: '14:30', day_of_week: 'Monday' },
                    { id: 'c4', subject_id: 's4', teacher_id: 't4', room: 'Room 102', start_time: '14:45', end_time: '16:15', day_of_week: 'Monday' },
                    { id: 'c5', subject_id: 's5', teacher_id: 't5', room: 'Lab 1A', start_time: '16:30', end_time: '18:00', day_of_week: 'Monday' }
                ]));
            }

            const todayStr = new Date().toISOString().split('T')[0];
            if (!localStorage.getItem('cp_mock_sessions_' + todayStr)) {
                localStorage.setItem('cp_mock_sessions_' + todayStr, JSON.stringify([
                    { id: 'sess_1', class_id: 'c1', date: todayStr, status: 'coming', note: 'Arriving with lecture notes handout', updated_by: 'Alex M. (Rep)', updated_at: new Date(Date.now() - 3600000).toISOString() },
                    { id: 'sess_2', class_id: 'c2', date: todayStr, status: 'arrived', note: 'Present in class', updated_by: 'Alex M. (Rep)', updated_at: new Date(Date.now() - 1800000).toISOString() },
                    { id: 'sess_3', class_id: 'c3', date: todayStr, status: 'delayed', note: 'Traffic delay, starting 15 mins late', updated_by: 'Alex M. (Rep)', updated_at: new Date(Date.now() - 900000).toISOString() },
                    { id: 'sess_4', class_id: 'c4', date: todayStr, status: 'scheduled', note: '', updated_by: 'System', updated_at: new Date().toISOString() },
                    { id: 'sess_5', class_id: 'c5', date: todayStr, status: 'absent', note: 'Faculty conference out of town', updated_by: 'Alex M. (Rep)', updated_at: new Date(Date.now() - 7200000).toISOString() }
                ]));
            }

            if (!localStorage.getItem('cp_mock_logs')) {
                localStorage.setItem('cp_mock_logs', JSON.stringify([
                    { id: 'log_1', class_id: 'c1', status: 'coming', note: 'Arriving with lecture notes handout', updated_by: 'Alex M. (Rep)', timestamp: new Date(Date.now() - 3600000).toISOString() },
                    { id: 'log_2', class_id: 'c2', status: 'arrived', note: 'Present in class', updated_by: 'Alex M. (Rep)', timestamp: new Date(Date.now() - 1800000).toISOString() }
                ]));
            }

            return {
                from: (table) => ({
                    select: (query = '*') => ({
                        eq: (col, val) => ({
                            single: async () => {
                                const data = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                                const found = data.find(item => item[col] === val);
                                return { data: found || null, error: found ? null : { message: 'Not found' } };
                            },
                            then: async (resolve) => {
                                const data = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                                const filtered = data.filter(item => item[col] === val);
                                resolve({ data: filtered, error: null });
                            }
                        }),
                        order: (col, opts) => ({
                            then: async (resolve) => {
                                let data = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                                resolve({ data: data, error: null });
                            }
                        }),
                        then: async (resolve) => {
                            let data = [];
                            if (table === 'sessions') {
                                const todayStr = appState.filters.date;
                                data = JSON.parse(localStorage.getItem(`cp_mock_sessions_${todayStr}`) || '[]');
                            } else {
                                data = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                            }
                            resolve({ data: data, error: null });
                        }
                    }),
                    insert: (payload) => ({
                        select: () => ({
                            single: async () => {
                                const list = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                                const newItem = { id: 'id_' + Math.random().toString(36).substring(2, 9), ...payload };
                                list.push(newItem);
                                localStorage.setItem(`cp_mock_${table}`, JSON.stringify(list));
                                return { data: newItem, error: null };
                            }
                        }),
                        then: async (resolve) => {
                            const list = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                            const newItem = { id: 'id_' + Math.random().toString(36).substring(2, 9), ...payload };
                            list.push(newItem);
                            localStorage.setItem(`cp_mock_${table}`, JSON.stringify(list));
                            resolve({ data: newItem, error: null });
                        }
                    }),
                    upsert: (payload) => ({
                        then: async (resolve) => {
                            const targetTable = table === 'sessions' ? `cp_mock_sessions_${appState.filters.date}` : `cp_mock_${table}`;
                            let list = JSON.parse(localStorage.getItem(targetTable) || '[]');
                            const index = list.findIndex(i => i.id === payload.id || (payload.class_id && i.class_id === payload.class_id && i.date === payload.date));
                            if (index >= 0) {
                                list[index] = { ...list[index], ...payload };
                            } else {
                                payload.id = payload.id || 'sess_' + Math.random().toString(36).substring(2, 9);
                                list.push(payload);
                            }
                            localStorage.setItem(targetTable, JSON.stringify(list));
                            resolve({ data: payload, error: null });
                        }
                    }),
                    delete: () => ({
                        eq: (col, val) => ({
                            then: async (resolve) => {
                                let list = JSON.parse(localStorage.getItem(`cp_mock_${table}`) || '[]');
                                list = list.filter(i => i[col] !== val);
                                localStorage.setItem(`cp_mock_${table}`, JSON.stringify(list));
                                resolve({ data: null, error: null });
                            }
                        })
                    })
                }),
                auth: {
                    getSession: async () => {
                        const rep = localStorage.getItem('cp_logged_rep');
                        return { data: { session: rep ? { user: JSON.parse(rep) } : null }, error: null };
                    },
                    signInWithPassword: async ({ email, password }) => {
                        if (email === 'rep@classpulse.app' && password === 'admin123') {
                            const user = { id: 'rep_admin_01', email, role: 'representative', name: 'Alex Miller (Head Rep)' };
                            localStorage.setItem('cp_logged_rep', JSON.stringify(user));
                            return { data: { user, session: { user } }, error: null };
                        }
                        return { data: { user: null, session: null }, error: { message: 'Invalid representative email or password.' } };
                    },
                    signOut: async () => {
                        localStorage.removeItem('cp_logged_rep');
                        return { error: null };
                    }
                },
                channel: () => ({
                    on: () => ({ subscribe: () => ({}) })
                }),
                removeChannel: () => {}
            };
        }

        async function checkConnection() {
            try {
                const { data, error } = await supabaseClient.from('teachers').select('*');
                if (error) throw error;
                appState.connectionStatus = 'connected';
                updateConnectionUI();
            } catch (err) {
                appState.connectionStatus = 'disconnected';
                updateConnectionUI();
            }
        }

        function updateConnectionUI() {
            const indicator = document.getElementById('connection-indicator');
            const text = document.getElementById('connection-text');
            if (!indicator || !text) return;

            if (appState.connectionStatus === 'connected') {
                indicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                text.textContent = "Live Synced";
            } else {
                indicator.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                text.textContent = "Offline / Syncing";
            }
        }

        async function loadAppData() {
            appState.loading = true;
            renderApp();

            try {
                const { data: sessionData } = await supabaseClient.auth.getSession();
                if (sessionData && sessionData.session) {
                    appState.user = sessionData.session.user;
                    appState.userRole = 'representative';
                } else {
                    appState.user = null;
                    appState.userRole = 'student';
                }

                const [tRes, sRes, cRes, sessRes, logRes] = await Promise.all([
                    supabaseClient.from('teachers').select('*'),
                    supabaseClient.from('subjects').select('*'),
                    supabaseClient.from('classes').select('*'),
                    supabaseClient.from('sessions').select('*'),
                    supabaseClient.from('audit_logs').select('*')
                ]);

                appState.teachers = tRes.data || [];
                appState.subjects = sRes.data || [];
                appState.classes = cRes.data || [];
                appState.sessions = sessRes.data || [];
                appState.auditLogs = logRes.data || [];

                appState.loading = false;
                appState.error = null;
                updateConnectionUI();
            } catch (err) {
                console.error("Failed to load app data:", err);
                appState.error = "Could not connect to database. Operating in offline demo mode.";
                appState.loading = false;
            }
            renderApp();
        }

        function renderApp() {
            const dateEl = document.getElementById('header-date');
            if (dateEl) {
                const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                dateEl.textContent = new Date(appState.filters.date + 'T00:00:00').toLocaleDateString('en-US', options);
            }

            const authNav = document.getElementById('auth-nav-container');
            if (authNav) {
                if (appState.userRole === 'representative') {
                    authNav.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <button onclick="appState.currentView = 'admin'; renderApp();" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white hover:bg-sky-700 transition shadow-sm">
                                <i class="fa-solid fa-gauge-high"></i>
                                <span>Admin Panel</span>
                            </button>
                            <button onclick="handleSignOut()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Sign Out">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    `;
                } else {
                    authNav.innerHTML = `
                        <button onclick="appState.currentView = 'login'; renderApp();" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-white transition shadow-sm">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>Rep Login</span>
                        </button>
                    `;
                }
            }

            const syncTimeEl = document.getElementById('footer-sync-time');
            if (syncTimeEl) {
                syncTimeEl.textContent = `Last synced: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            }

            const container = document.getElementById('view-container');
            if (!container) return;

            if (appState.currentView === 'dashboard') {
                container.innerHTML = renderStudentDashboard();
            } else if (appState.currentView === 'login') {
                container.innerHTML = renderLoginView();
            } else if (appState.currentView === 'admin') {
                if (appState.userRole !== 'representative') {
                    appState.currentView = 'login';
                    renderApp();
                    return;
                }
                container.innerHTML = renderAdminDashboard();
            } else if (appState.currentView === 'history') {
                container.innerHTML = renderHistoryView();
            } else if (appState.currentView === 'setup-guide') {
                container.innerHTML = renderSetupGuideView();
            }
        }

        function renderStudentDashboard() {
            const todayClasses = appState.classes;
            const totalScheduled = todayClasses.length;
            
            let confirmedCount = 0;
            let arrivedCount = 0;
            let delayedCount = 0;
            let canceledCount = 0;
            let pendingCount = 0;

            const enrichedClasses = todayClasses.map(cls => {
                const session = appState.sessions.find(s => s.class_id === cls.id);
                const status = session ? session.status : 'scheduled';
                const note = session ? session.note : '';
                const updatedBy = session ? session.updated_by : '';
                const updatedAt = session ? session.updated_at : '';

                if (status === 'coming') confirmedCount++;
                if (status === 'arrived') arrivedCount++;
                if (status === 'delayed') delayedCount++;
                if (status === 'absent' || status === 'canceled') canceledCount++;
                if (status === 'scheduled') pendingCount++;

                const teacher = appState.teachers.find(t => t.id === cls.teacher_id) || { name: 'Unknown Teacher' };
                const subject = appState.subjects.find(s => s.id === cls.subject_id) || { name: 'Unknown Subject', code: '' };

                return { ...cls, teacher, subject, status, note, updatedBy, updatedAt };
            });

            const filtered = enrichedClasses.filter(cls => {
                if (appState.filters.status !== 'all' && cls.status !== appState.filters.status) return false;
                if (appState.filters.teacher !== 'all' && cls.teacher_id !== appState.filters.teacher) return false;
                if (appState.filters.subject !== 'all' && cls.subject_id !== appState.filters.subject) return false;
                if (appState.filters.search) {
                    const q = appState.filters.search.toLowerCase();
                    const matchName = cls.teacher.name.toLowerCase().includes(q);
                    const matchSubj = cls.subject.name.toLowerCase().includes(q) || cls.subject.code.toLowerCase().includes(q);
                    const matchRoom = cls.room.toLowerCase().includes(q);
                    if (!matchName && !matchSubj && !matchRoom) return false;
                }
                return true;
            });

            filtered.sort((a, b) => a.start_time.localeCompare(b.start_time));

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full flex flex-col space-y-8">

                        </div>
                        <div onclick="setFilterStatus('delayed')" class="cursor-pointer bg-white dark:bg-slate-900 border ${appState.filters.status === 'delayed' ? 'border-amber-500 ring-2 ring-amber-500/20' : 'border-slate-200 dark:border-slate-800'} rounded-2xl p-4 transition hover:border-slate-300 dark:hover:border-slate-700">

        function renderClassCard(cls) {
            let badgeClass = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700';
            let badgeText = 'Scheduled (Pending)';
            let badgeIcon = 'fa-clock';

            if (cls.status === 'coming') {
                badgeClass = 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
                badgeText = 'Confirmed Coming';
                badgeIcon = 'fa-circle-check';
            } else if (cls.status === 'arrived') {
                badgeClass = 'bg-teal-50 text-teal-700 dark:bg-teal-950/60 dark:text-teal-300 border-teal-200 dark:border-teal-800';
                badgeText = 'Teacher Arrived';
                badgeIcon = 'fa-user-check';
            } else if (cls.status === 'delayed') {
                badgeClass = 'bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800';
                badgeText = 'Delayed';
                badgeIcon = 'fa-hourglass-half';
            } else if (cls.status === 'absent') {
                badgeClass = 'bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border-rose-200 dark:border-rose-800';
                badgeText = 'Teacher Absent';
                badgeIcon = 'fa-user-xmark';
            } else if (cls.status === 'canceled') {
                badgeClass = 'bg-red-50 text-red-700 dark:bg-red-950/60 dark:text-red-300 border-red-200 dark:border-red-800';
                badgeText = 'Class Canceled';
                badgeIcon = 'fa-ban';
            }

            return `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between transition hover:border-slate-300 dark:hover:border-slate-700">

                        <div class="flex items-center justify-between mb-3">

                                <i class="fa-regular fa-clock text-sky-500"></i>
                                <span>${cls.start_time} - ${cls.end_time}</span>
                            </div>

                            </div>

                            </div>
                        </div>

                        <div class="flex items-center space-x-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 mb-3">
                            <div class="w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-700 dark:text-slate-300">
                                ${cls.teacher.name.split(' ').map(n => n[0]).join('').substring(0, 2)}

                            <div>
                                <div class="text-xs text-slate-400">Teacher</div>
                                <div class="text-sm font-semibold text-slate-800 dark:text-slate-200">${cls.teacher.name}</div>
                            </div>
                        </div>

                        ${cls.note ? `
                            <div class="bg-sky-50 dark:bg-sky-950/40 border border-sky-100 dark:border-sky-900/50 rounded-xl p-2.5 text-xs text-sky-800 dark:text-sky-300 mb-3 flex items-start space-x-2">
                                <i class="fa-solid fa-circle-info mt-0.5 flex-shrink-0"></i>
                                <div><strong>Note:</strong> ${cls.note}</div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                        <span>Updated: ${cls.updatedAt ? new Date(cls.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Never'}</span>
                        <span class="italic">By ${cls.updatedBy || 'System'}</span>
                    </div>
                </div>
            `;
        }

        function renderLoginView() {
            return `

            const todayStr = appState.filters.date;
            const enriched = appState.classes.map(cls => {
                const session = appState.sessions.find(s => s.class_id === cls.id);
                const status = session ? session.status : 'scheduled';
                const note = session ? session.note : '';
                const teacher = appState.teachers.find(t => t.id === cls.teacher_id) || { name: 'Unknown' };
                const subject = appState.subjects.find(s => s.id === cls.subject_id) || { name: 'Unknown', code: '' };
                return { ...cls, teacher, subject, status, note, sessionId: session ? session.id : null };

                                <i class="fa-solid fa-plus"></i>
                                <span>Add Class</span>
                            </button>

                                <i class="fa-solid fa-chalkboard-user"></i>
                                <span>Manage Teachers</span>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-6">

                            </div>
                            <input type="date" value="${todayStr}" onchange="updateDateFilter(this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm font-medium">

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">
                                        <th class="py-3 px-4">Time</th>
                                        <th class="py-3 px-4">Subject & Room</th>

                                            </td>
                                            <td class="py-4 px-4 font-medium text-slate-800 dark:text-slate-200">
                                                ${cls.teacher.name}

                                                    ${cls.status === 'arrived' ? 'bg-teal-100 text-teal-800 dark:bg-teal-950 dark:text-teal-300' : ''}
                                                    ${cls.status === 'delayed' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300' : ''}

                            </table>

                        <div class="space-y-6 text-sm text-slate-700 dark:text-slate-300">

                                <h3 class="font-bold text-base text-slate-900 dark:text-slate-100 mb-2">1. Supabase Project Configuration</h3>
                                <p class="mb-2">Create a new project on <a href="https://supabase.com" target="_blank" class="text-sky-600 underline">Supabase</a>, then execute the following SQL schema in your SQL Editor:</p>
                                <pre class="bg-slate-900 text-slate-200 p-4 rounded-xl text-xs overflow-x-auto font-mono"><code>-- Teachers Table
CREATE TABLE teachers (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    name TEXT NOT NULL,
    department TEXT,
    email TEXT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- Subjects Table
CREATE TABLE subjects (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    name TEXT NOT NULL,
    code TEXT NOT NULL,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- Classes Table
CREATE TABLE classes (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    subject_id UUID REFERENCES subjects(id) ON DELETE CASCADE,
    teacher_id UUID REFERENCES teachers(id) ON DELETE CASCADE,
    room TEXT NOT NULL,
    start_time TEXT NOT NULL,
    end_time TEXT NOT NULL,
    day_of_week TEXT NOT NULL,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- Daily Sessions Attendance Table
CREATE TABLE sessions (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    class_id UUID REFERENCES classes(id) ON DELETE CASCADE,
    date DATE NOT NULL,
    status TEXT NOT NULL DEFAULT 'scheduled',
    note TEXT,
    updated_by TEXT,
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL,
    UNIQUE(class_id, date)
);

-- Audit History Table
CREATE TABLE audit_logs (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    class_id UUID REFERENCES classes(id) ON DELETE CASCADE,
    status TEXT NOT NULL,
    note TEXT,
    updated_by TEXT,
    timestamp TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);
</code></pre>

        function setFilterStatus(status) {
            appState.filters.status = appState.filters.status === status ? 'all' : status;
            renderApp();
        }

        function updateSearchFilter(val) {
            appState.filters.search = val;
            renderApp();
        }

        function updateTeacherFilter(val) {
            appState.filters.teacher = val;
            renderApp();
        }

        function updateSubjectFilter(val) {
            appState.filters.subject = val;
            renderApp();
        }

        function updateDateFilter(val) {
            appState.filters.date = val;
            loadAppData();
        }

        function resetFilters() {
            appState.filters.status = 'all';
            appState.filters.search = '';
            appState.filters.teacher = 'all';
            appState.filters.subject = 'all';
            renderApp();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showToast(error.message, 'error');
                return;
            }

            appState.user = data.user;
            appState.userRole = 'representative';
            appState.currentView = 'admin';
            showToast('Successfully signed in as Class Representative!', 'success');
            renderApp();
        }

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
            appState.user = null;
            appState.userRole = 'student';
            appState.currentView = 'dashboard';
            showToast('Signed out successfully.', 'info');
            renderApp();
        }

        async function updateClassStatus(classId, newStatus) {
            const todayStr = appState.filters.date;
            const repName = appState.user ? appState.user.email : 'Alex Miller (Rep)';
            
            const sessionPayload = {
                class_id: classId,
                date: todayStr,
                status: newStatus,
                updated_by: repName,
                updated_at: new Date().toISOString()
            };

            const { error } = await supabaseClient.from('sessions').upsert(sessionPayload);
            if (error) {
                showToast('Failed to update status in database.', 'error');
                return;
            }

            await supabaseClient.from('audit_logs').insert({
                class_id: classId,
                status: newStatus,
                note: '',
                updated_by: repName,
                timestamp: new Date().toISOString()
            });

            showToast(`Status updated to ${newStatus.toUpperCase()} successfully!`, 'success');
            loadAppData();
        }

        function openNoteModal(classId, currentNote) {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Add Class Status Note</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-slate-500">Provide any specific details (e.g. "Arriving 15 mins late in Room 302").</p>
                        <textarea id="class-note-input" rows="3" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">${currentNote}</textarea>

                        </div>
                    </div>
                </div>
            `;
        }

        async function saveClassNote(classId) {
            const note = document.getElementById('class-note-input').value;
            const todayStr = appState.filters.date;
            const repName = appState.user ? appState.user.email : 'Alex Miller (Rep)';

            const existing = appState.sessions.find(s => s.class_id === classId && s.date === todayStr) || { status: 'scheduled' };

            const sessionPayload = {
                class_id: classId,
                date: todayStr,
                status: existing.status,
                note: note,
                updated_by: repName,
                updated_at: new Date().toISOString()
            };

            await supabaseClient.from('sessions').upsert(sessionPayload);
            closeModal();
            showToast('Note saved successfully!', 'success');
            loadAppData();
        }

            modalContainer.innerHTML = `

                            <div class="flex justify-end space-x-3 pt-3">

                                <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-semibold">Add Class</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleAddClassSubmit(e) {
            e.preventDefault();
            const subject_id = document.getElementById('new-class-subject').value;
            const teacher_id = document.getElementById('new-class-teacher').value;
            const start_time = document.getElementById('new-class-start').value;
            const end_time = document.getElementById('new-class-end').value;
            const room = document.getElementById('new-class-room').value;

        async function handleAddTeacherSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('new-teacher-name').value;
            const department = document.getElementById('new-teacher-dept').value;
            const email = document.getElementById('new-teacher-email').value;

            const { error } = await supabaseClient.from('teachers').insert({ name, department, email });
            if (error) {
                showToast('Failed to add teacher.', 'error');
                return;
            }

            showToast('Teacher added successfully!', 'success');
            openManageTeachersModal();
            loadAppData();
        }

        async function deleteTeacher(id) {
            const { error } = await supabaseClient.from('teachers').delete().eq('id', id);
            if (error) {
                showToast('Failed to delete teacher.', 'error');
                return;
            }
            showToast('Teacher removed.', 'success');
            openManageTeachersModal();
            loadAppData();
        }

        function openSetupGuideModal() {
            // Setup guide removed
        }

        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) modalContainer.innerHTML = '';
        }

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            if (!toastContainer) return;

            const id = 'toast_' + Math.random().toString(36).substring(2, 9);
            const bgClass = type === 'error' ? 'bg-rose-600 text-white' : (type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white');

            const toast = document.createElement('div');
            toast.id = id;
            toast.className = `${bgClass} px-4 py-3 rounded-xl text-xs font-medium shadow-lg pointer-events-auto flex items-center space-x-2 transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : (type === 'success' ? 'fa-circle-check' : 'fa-circle-info')}"></i>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('cp_theme', 'light');
                if (icon) icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.add('dark');
                localStorage.setItem('cp_theme', 'dark');
                if (icon) icon.className = 'fa-solid fa-sun';
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            appState.installPromptEvent = e;
            const installBtn = document.getElementById('install-btn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');
            }
        });

        async function installPWA() {
            if (appState.installPromptEvent) {
                appState.installPromptEvent.prompt();
                const result = await appState.installPromptEvent.userChoice;
                if (result.outcome === 'accepted') {
                    showToast('ClassPulse installed successfully!', 'success');
                }
                appState.installPromptEvent = null;
                const installBtn = document.getElementById('install-btn');
                if (installBtn) installBtn.classList.add('hidden');
            } else {
                showToast('To install, open your browser settings and select "Add to Home Screen".', 'info');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('cp_theme') || 'light';
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                if (icon) icon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                if (icon) icon.className = 'fa-solid fa-moon';
            }

            initSupabase();
            loadAppData();
        };
